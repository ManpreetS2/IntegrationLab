[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrationlab-sdk"
version = "0.1.0"
description = "Server-side Python SDK that reports sanitized HTTP outcomes to a self-hosted IntegrationLab."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Manpreet Singh" }]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]

[project.urls]
Documentation = "https://github.com/ManpreetS2/IntegrationLab/blob/main/docs/universal-v2/QUICKSTART.md"

[tool.setuptools.packages.find]
where = ["src"]

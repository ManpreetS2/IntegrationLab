server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA hash routing — still serve index.html for unknown static paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API / webhook / health to the backend service (docker compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Stripe-Signature $http_stripe_signature;
        proxy_request_buffering on;
    }

    location /webhooks/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Stripe-Signature $http_stripe_signature;
        # Critical: preserve the exact request body for Stripe signature checks.
        proxy_request_buffering on;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }
}

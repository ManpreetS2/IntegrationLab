# Full local container stack (Compose packaging; not AWS production mode).
#
# Usage:
#   docker compose -f docker-compose.full.yml up --build
#
# Ordering:
#   postgres healthy → migrate (alembic upgrade head) → backend → frontend
#
# Frontend container is for local packaging only — AWS uses S3/CloudFront.
# The production backend image does NOT migrate on every boot; migrate is a
# one-shot Compose service (mirrors the ECS one-off migration task).
#
# Production settings require an operator key. For local Compose only we use a
# clearly non-production default that can be overridden:
#   OPERATOR_API_KEY=<your-local-key> docker compose -f docker-compose.full.yml up --build

services:
  postgres:
    image: postgres:18
    container_name: integrationlab-full-postgres
    environment:
      POSTGRES_USER: integrationlab
      POSTGRES_PASSWORD: integrationlab
      POSTGRES_DB: integrationlab
    volumes:
      - full_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrationlab -d integrationlab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: integrationlab-backend:compose
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: integrationlab-full-migrate
    environment:
      # Local Compose defaults to development so short demo operator keys work.
      # Production AWS still uses APP_ENV=production (≥24-char key required).
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://integrationlab:integrationlab@postgres:5432/integrationlab
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-local-demo-operator-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    image: integrationlab-backend:compose
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: integrationlab-full-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: local-compose
      DATABASE_URL: postgresql+psycopg://integrationlab:integrationlab@postgres:5432/integrationlab
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-local-demo-operator-key-change-me}
      FRONTEND_URL: http://localhost:8080
      GITHUB_OAUTH_REDIRECT_URI: http://localhost:8080/api/oauth/github/callback
      CORS_ORIGINS: '["http://localhost:8080"]'
      # Real provider acceptance — supply via shell env or a local `.env` next to
      # this compose file (never commit real values). OAuth/webhook routes return
      # clear 503s when these are unset.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: integrationlab-full-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  full_postgres_data:
